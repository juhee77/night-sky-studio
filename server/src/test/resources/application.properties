spring.datasource.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
nss.cors-origins=http://127.0.0.1:5173
# 테스트끼리 같은 주소로 많이 보내므로 넉넉하게 (제한 자체는 RateLimitTest에서 따로 본다)
nss.rate.general=100000
nss.rate.strict=100000
