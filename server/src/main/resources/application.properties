# 개발용: 파일 H2 DB (server/data). 배포는 환경 변수로 PostgreSQL을 쓴다 (docker-compose.yml).
spring.application.name=night-sky-server
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/nss;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
# 화면(정적판)이 있는 주소들 (쉼표로 여러 개)
nss.cors-origins=${CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,https://juhee77.github.io}
