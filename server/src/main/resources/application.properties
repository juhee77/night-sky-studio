# 개발용: 파일 H2 DB (server/data). 배포는 환경 변수로 PostgreSQL을 쓴다 (docker-compose.yml).
spring.application.name=night-sky-server
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/nss;MODE=PostgreSQL}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:8080}
# 화면(정적판)이 있는 주소들 (쉼표로 여러 개)
nss.cors-origins=${CORS_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,https://juhee77.github.io}
# 요청 횟수 제한 (IP마다 1분): 일반, 가입·로그인·올리기·짧은 링크 만들기
nss.rate.general=${RATE_GENERAL:120}
nss.rate.strict=${RATE_STRICT:20}
# 앞에 프록시(로드 밸런서)가 있으면 X-Forwarded-For로 IP를 본다
nss.trust-proxy=${TRUST_PROXY:false}
