<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c1d" />
    <title>밤하늘 연출실 · 상영관</title>
    <meta name="description" content="링크로 받은 불꽃쇼를 브라우저에서 바로 봅니다." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <canvas id="stage" aria-label="불꽃쇼 무대"></canvas>

    <section class="card" id="card" aria-live="polite">
      <p class="eyebrow">불꽃쇼가 도착했습니다</p>
      <h1 id="show-title">불러오는 중…</h1>
      <p id="show-meta" class="meta"></p>
      <div id="music-ask" class="music-ask" hidden>
        <p id="music-ask-text"></p>
        <div class="row">
          <label class="file-btn" for="music-file" id="pick-music">음악 파일 고르기</label>
          <button type="button" id="no-music" class="quiet">음악 없이 보기</button>
        </div>
        <input type="file" id="music-file" class="visually-hidden" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.flac" />
      </div>
      <p id="music-note" class="note" hidden></p>
      <button type="button" id="start" class="primary big" disabled>▶ 쇼 보기</button>
      <p class="note">소리를 켜고, 휴대폰은 가로로 돌리면 더 크게 보입니다.</p>
    </section>

    <section class="card end" id="end-card" hidden>
      <h2>쇼가 끝났습니다</h2>
      <div class="row">
        <button type="button" id="again" class="primary">다시 보기</button>
        <button type="button" id="import-end">내 쇼로 가져와 고치기</button>
      </div>
      <a id="make-own" class="link">나도 불꽃쇼 만들어 보기</a>
    </section>

    <form class="bar" id="bar" hidden>
      <button type="button" id="play" aria-label="일시정지">❚❚</button>
      <input type="range" id="scrub" min="0" max="60" step="0.01" value="0" aria-label="재생 위치" />
      <output id="clock" for="scrub">0:00</output>
      <label><span>관람석</span> <select id="seat"></select></label>
      <button type="button" id="sound" aria-pressed="true">소리 켜짐</button>
      <button type="button" id="fullscreen">전체 화면</button>
      <button type="button" id="import">내 쇼로 가져오기</button>
    </form>

    <p class="toast" id="toast" role="status" hidden></p>

    <script type="module" src="../src/viewer.ts"></script>
  </body>
</html>
