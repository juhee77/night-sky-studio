<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c1d" />
    <title>밤하늘 연출실 · 렌더 시험</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="stage" aria-label="불꽃이 터지는 밤하늘 무대"></canvas>

    <section class="hud" aria-live="off">
      <h1>밤하늘 연출실 <span>0단계 렌더 시험</span></h1>
      <dl>
        <div><dt>fps</dt><dd id="fps">–</dd></div>
        <div><dt>입자</dt><dd id="particles">–</dd></div>
        <div><dt>계산</dt><dd id="sim-ms">–</dd></div>
        <div><dt>그리기</dt><dd id="draw-ms">–</dd></div>
      </dl>
      <p id="warnings" hidden></p>
    </section>

    <p class="toast" id="toast" role="status" hidden></p>

    <form class="controls" id="controls">
      <button type="button" id="play" aria-label="일시정지">❚❚</button>
      <input type="range" id="scrub" min="0" max="40" step="0.01" value="0" aria-label="재생 위치" />
      <output id="clock" for="scrub">0:00.00</output>

      <label>관람석
        <select id="seat"></select>
      </label>
      <label>밀도
        <select id="density">
          <option value="1">높음</option>
          <option value="0.6">보통</option>
          <option value="0.35">낮음</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="reflection" checked /> 물 반사</label>
      <button type="button" id="verify">재현성 검사</button>
    </form>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
