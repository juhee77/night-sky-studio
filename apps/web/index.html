<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0c1d" />
    <title>밤하늘 연출실</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="group show-name">
        <button type="button" id="shows-btn">내 쇼</button>
        <input id="title" aria-label="쇼 제목" maxlength="60" />
        <span id="save-state" class="save-state" role="status">저장됨</span>
      </div>

      <div class="group transport">
        <button type="button" id="play" class="primary" aria-label="재생">▶</button>
        <output id="clock" aria-label="재생 위치">0:00.00</output>
      </div>

      <div class="group music">
        <label for="music">음악</label>
        <select id="music"></select>
        <input type="file" id="music-file" accept="audio/*" hidden />
      </div>

      <div class="group tempo">
        <label for="bpm">BPM</label>
        <input id="bpm" type="number" min="40" max="240" step="0.1" />
        <label for="offset">첫 박</label>
        <input id="offset" type="number" min="0" step="0.01" />
        <button type="button" id="tap" title="재생하면서 박자에 맞춰 누르세요 (T 키)">박자 두드리기</button>
        <button type="button" id="detect" title="음악에서 박자를 자동으로 찾습니다">자동 찾기</button>
      </div>

      <div class="group view">
        <label for="seat">관람석</label>
        <select id="seat"></select>
        <button type="button" id="sound" aria-pressed="true">효과음 켜짐</button>
      </div>
    </header>

    <main class="workspace">
      <section class="stage-wrap">
        <canvas id="stage" aria-label="불꽃이 터지는 밤하늘 무대. 누르면 가까운 발사 위치에 지금 시각으로 불꽃을 놓습니다."></canvas>
        <dl class="hud" aria-hidden="true">
          <div><dt>fps</dt><dd id="fps">–</dd></div>
          <div><dt>입자</dt><dd id="particles">–</dd></div>
        </dl>
        <p id="warnings" class="warnings" hidden></p>
      </section>
      <aside class="panel" id="panel" aria-label="불꽃 설정"></aside>
    </main>

    <section class="timeline-wrap" aria-label="시간표">
      <div class="timeline-tools">
        <label for="snap">박자에 붙이기</label>
        <select id="snap">
          <option value="beat">한 박</option>
          <option value="half">반 박</option>
          <option value="off">끄기</option>
        </select>
        <span class="sep"></span>
        <button type="button" id="zoom-out" aria-label="시간표 축소">−</button>
        <button type="button" id="zoom-in" aria-label="시간표 확대">+</button>
        <span class="sep"></span>
        <button type="button" id="undo" title="되돌리기 (⌘Z)">되돌리기</button>
        <button type="button" id="redo" title="다시 하기 (⇧⌘Z)">다시 하기</button>
        <span class="keys">Space 재생 · 1–3 지금 시각에 놓기 · Delete 지우기 · ⌘C/⌘V 복사·붙여넣기 · ⌘+휠 확대</span>
      </div>
      <div class="timeline-scroll"><canvas id="timeline"></canvas></div>
    </section>

    <dialog id="shows-dialog" aria-labelledby="shows-title">
      <form method="dialog" class="dialog-head">
        <h2 id="shows-title">내 쇼</h2>
        <button value="close" aria-label="닫기">닫기</button>
      </form>
      <div class="dialog-actions">
        <button type="button" id="new-show" class="primary">새 쇼 만들기</button>
        <button type="button" id="import-show">쇼 파일 가져오기</button>
        <button type="button" id="export-show">지금 쇼를 파일로 내보내기</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden />
      </div>
      <ul id="show-list" class="show-list"></ul>
      <p class="note">쇼는 이 브라우저 안에만 저장됩니다. 다른 기기로 옮기려면 파일로 내보낸 뒤 가져오세요.</p>
    </dialog>

    <p class="toast" id="toast" role="status" hidden></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
